services:
  trainer:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: wakeforge:dev
    container_name: wakeforge
    init: true
    shm_size: 8gb
    command: py-train -m uvicorn trainer.server.app:app --host 0.0.0.0 --port 8790 --reload --reload-dir trainer
    ports:
      # WAKEFORGE_BIND=0.0.0.0 (in .env) opens the port to the LAN, e.g. for ESPHome to fetch exported models.
      # The API has no login: only do that in a trusted network.
      - "${WAKEFORGE_BIND:-127.0.0.1}:8790:8790"
    volumes:
      - ./:/app
    working_dir: /app
    environment:
      CWW_DATA: /app/data
      HF_HOME: /app/data/cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
